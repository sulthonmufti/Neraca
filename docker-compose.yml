version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neraca_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - neraca_network

  webserver:
    image: nginx:alpine
    container_name: neraca_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - neraca_network

  db:
    image: postgres:16-alpine
    container_name: neraca_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - neraca_network

  redis:
    image: redis:alpine
    container_name: neraca_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - neraca_network

networks:
  neraca_network:
    driver: bridge

volumes:
  pgdata: